AWSTemplateFormatVersion: '2010-09-09'
Description: S3 and CloudFront OAC for Noticeboard Admin Frontend

Parameters:
  BucketName:
    Type: String
    Default: notice-admin-fe-dev
    Description: Name of the S3 bucket for frontend hosting
  BackendPrivateDnsName:
    Type: String
    MinLength: 1
    Description: BE 스택의 BackendPrivateDnsName 출력값으로 전달받는 백엔드 EC2의 프라이빗 DNS 이름
  BackendVpcOriginId:
    Type: String
    MinLength: 1
    Description: BE 스택에서 생성한 CloudFront VPC Origin의 ID. BackendVpcOriginId 출력값을 전달

Resources:
  # 1. S3 버킷 생성 (완전 비공개)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # 2. CloudFront OAC (Origin Access Control)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${BucketName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 3. CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: BackendOrigin
            DomainName: !Ref BackendPrivateDnsName
            VpcOriginConfig:
              VpcOriginId: !Ref BackendVpcOriginId
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: BackendOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - POST
              - PUT
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            # AWS 관리형 CachingDisabled: API 응답 캐시 비활성화
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AWS 관리형 AllViewer: 헤더, 쿠키, 쿼리 문자열 전달
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution.Id}"

Outputs:
  BucketNameOutput:
    Value: !Ref FrontendBucket
    Description: S3 Bucket Name
  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Description: CloudFront Distribution Domain Name