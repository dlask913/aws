# Deploy as its own stack. See split-stacks.ko.md.
AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 with Java 17/systemd, S3 artifacts and SSM deploy permissions.
Parameters:
  ExistingDeployRoleName:
    Type: String
    Default: GitHubActionsDeployRole
    Description: Existing GitHub OIDC role. Its trust policy is not changed.
    AllowedPattern: '[A-Za-z0-9+=,.@_-]+'
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
    Description: network output BackendSecurityGroup
  BackendPrivateSubnet:
    Type: AWS::EC2::Subnet::Id
    Description: network output BackendPrivateSubnet (private)
Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBuilds
            Status: Enabled
            Prefix: admin-backend/
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - Fn::GetAtt: ArtifactBucket.Arn
              - Fn::Sub: ${ArtifactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadBackendBuilds
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: ${ArtifactBucket.Arn}/admin-backend/*
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: InstanceRole
  BackendInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId:
        Ref: LatestAmiId
      InstanceType:
        Ref: InstanceType
      IamInstanceProfile:
        Ref: InstanceProfile
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: false
          SubnetId:
            Ref: BackendPrivateSubnet
          GroupSet:
            - Ref: BackendSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${AWS::StackName}-backend
      UserData:
        Fn::Base64: |
          #!/bin/bash

          set -euo pipefail
          systemctl enable --now amazon-ssm-agent

          # S3 Gateway Endpoint를 통해 Amazon Linux 저장소에 접근
          dnf --disablerepo='*' --enablerepo=amazonlinux install -y java-17-amazon-corretto-headless
          command -v aws
          java -version

          id noticeboard >/dev/null 2>&1 || useradd --system --home-dir /var/lib/noticeboard-admin --shell /sbin/nologin noticeboard
          install -d -m 0755 /opt/noticeboard-admin /opt/noticeboard-admin/releases
          install -d -m 0750 -o noticeboard -g noticeboard /var/lib/noticeboard-admin

          cat > /etc/systemd/system/noticeboard-admin.service <<'UNIT'
          [Unit]
          Description=Noticeboard admin Spring Boot application
          Wants=network-online.target
          After=network-online.target
          ConditionPathExists=/opt/noticeboard-admin/current.jar

          [Service]
          Type=simple
          User=noticeboard
          Group=noticeboard
          WorkingDirectory=/var/lib/noticeboard-admin
          ExecStart=/usr/bin/java -XX:MaxRAMPercentage=65 -jar /opt/noticeboard-admin/current.jar --spring.profiles.active=prod
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=60
          SuccessExitStatus=143
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=/var/lib/noticeboard-admin
          UMask=0027

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable noticeboard-admin.service
          # 배포 프로필 설정과 실제 앱 준비 상태 검사 프로그램은 첫 배포 전에 준비
          touch /opt/noticeboard-admin/bootstrap-complete
    Metadata:
      Comment: '초기 설정 완료 신호를 CloudFormation에 보내지 않으므로 스택 생성 완료만으로 초기 설정 성공을 판단하지 않고 배포 단계에서 cloud-init 상태와 완료 파일을 확인한다.'
  GitHubBackendPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        Fn::Sub: ${AWS::StackName}-backend-deploy
      Roles:
        - Ref: ExistingDeployRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:PutObject
            Resource:
              Fn::Sub: ${ArtifactBucket.Arn}/admin-backend/*
          - Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${BackendInstance}
          - Effect: Allow
            Action: ssm:GetCommandInvocation
            Resource: '*'
Outputs:
  EC2InstanceId:
    Value:
      Ref: BackendInstance
  BackendArtifactBucket:
    Value:
      Ref: ArtifactBucket
  InstanceRoleName:
    Value:
      Ref: InstanceRole
  BackendInstanceArn:
    Value:
      Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${BackendInstance}
  BackendPrivateDnsName:
    Value:
      Fn::GetAtt:
        - BackendInstance
        - PrivateDnsName
